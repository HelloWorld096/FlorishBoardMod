name: Build APK

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main, experimental ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
      - name: Restore Gradle cache
        # One cache shared by every branch, stored as a release asset (GitHub's own cache can't be shared between
        # branches). Gradle's build cache is keyed by task inputs, so branches reuse each other's results safely.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          if gh release download ci-cache -R "$GITHUB_REPOSITORY" -p gradle-home.tar.zst -O /tmp/gradle-home.tar.zst; then
            tar -I zstd -xf /tmp/gradle-home.tar.zst -C "$HOME"
            echo "::notice title=Gradle cache::restored $(du -h /tmp/gradle-home.tar.zst | cut -f1)"
            rm -f /tmp/gradle-home.tar.zst
          else
            echo "::notice title=Gradle cache::none found, cold build"
          fi
      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@v4.0.2
      - name: Build APK
        run: ./gradlew assembleMod --stacktrace --build-cache 2>&1 | tee build.log
        shell: bash
      - name: Verify APK signature
        shell: bash
        run: |
          apk=$(ls app/build/outputs/apk/mod/*.apk | head -1)
          echo "APK: $apk ($(stat -c %s "$apk") bytes)"
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/apksigner" verify --verbose --print-certs "$apk" 2>&1 | tee apk-verify.txt
          "$bt/aapt2" dump badging "$apk" 2>&1 | grep -E "^package|sdkVersion|targetSdk|native-code" | tee -a apk-verify.txt
      - name: Build timing summary
        if: always()
        shell: bash
        run: |
          set +e +o pipefail
          fc=$(grep -c "FROM-CACHE" build.log || true); ut=$(grep -c "UP-TO-DATE" build.log || true)
          ex=$(grep -c -E "^> Task .*[a-zA-Z]$" build.log || true)
          sdk=$(grep -E "Preparing \"Install|Install .*(NDK|CMake|Platform|Build-Tools)" build.log | head -6 | tr '\n' ';')
          slow=$(grep -E "^> Task :(app|lib)" build.log | grep -E "R8|minify|dex|Dex|lint|compile.*Kotlin|merge.*Resources|Native|externalNative" | head -12 | tr '\n' ';')
          tot=$(grep -E "BUILD (SUCCESSFUL|FAILED) in" build.log | tail -1)
          echo "::notice title=Gradle summary::tasks executed=$ex from-cache=$fc up-to-date=$ut | $tot | sdk-installs: $sdk | heavy tasks: $slow"
      - name: Save Gradle cache
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          ./gradlew --stop > /dev/null 2>&1
          tar -I 'zstd -T0 -3' \
            --exclude='*.lock' --exclude='gc.properties' --exclude='.gradle/caches/journal-1' \
            -cf /tmp/gradle-home.tar.zst -C "$HOME" .gradle/caches .gradle/wrapper
          size=$(stat -c %s /tmp/gradle-home.tar.zst)
          if [ "$size" -gt 1900000000 ]; then
            echo "::warning title=Gradle cache::$((size / 1000000)) MB is over the 2 GB asset limit, not saved"
            exit 0
          fi
          gh release view ci-cache -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create ci-cache -R "$GITHUB_REPOSITORY" --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "CI Gradle cache (managed by the build workflow, do not delete)" \
              --notes "Shared Gradle cache restored and updated by every build on every branch."
          if gh release upload ci-cache /tmp/gradle-home.tar.zst -R "$GITHUB_REPOSITORY" --clobber; then
            echo "::notice title=Gradle cache::saved $((size / 1000000)) MB"
          else
            echo "::warning title=Gradle cache::upload failed (another build may be writing it); keeping the old cache"
          fi
      - name: Surface errors as annotation
        if: failure()
        shell: bash
        run: |
          {
            grep -n -E "^e: |What went wrong|Execution failed|Could not |error:" -A3 build.log | head -80
          } > errors.txt || true
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' errors.txt)
          echo "::error title=Build errors::$msg"
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            apk-verify.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: florisboard-mod-apk
          path: app/build/outputs/apk/mod/*.apk
